server {
    listen 3017;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so deep links (/practice, /exam, ...) resolve to the app.
    # Flutter's build output is NOT content-hashed (main.dart.js,
    # flutter_bootstrap.js, assets/... keep their names on every build), so
    # everything is revalidated on each load (a cheap 304 via ETag) — a long
    # max-age here left browsers running the previous build for days.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # CanvasKit only changes with a Flutter engine upgrade; safe to cache.
    location /canvaskit/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

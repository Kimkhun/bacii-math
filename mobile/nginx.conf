server {
    listen 3017;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so deep links (/practice, /exam, ...) resolve to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the immutable build assets; never cache the entrypoints.
    location ~* \.(?:js|wasm|png|json|ttf|otf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
}

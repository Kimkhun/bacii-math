services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-bacii}
    # Bound to loopback only: the backend reaches Postgres over the compose
    # network (host "postgres"), so the port never needs to face the outside.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bacii}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # Loopback only — Redis has no auth here and holds the model config, the
    # explanation cache and the rate-limit counters. Never expose it publicly.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${BACKEND_PORT:-8016}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # Set ENVIRONMENT=production to make the backend refuse the dev-default
      # JWT_SECRET / ADMIN_PASSWORD / postgres password (see core.security).
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bacii}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@bacii.kh}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminBacII2026!}
      - GEMINI_PROJECT=${GEMINI_PROJECT:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-}
      - GEMINI_LOCATION=${GEMINI_LOCATION:-global}
      - GEMINI_RATE_LIMIT_PER_MINUTE=${GEMINI_RATE_LIMIT_PER_MINUTE:-10}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gemini-service-account.json
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      - TEXT_MODEL=${TEXT_MODEL:-qwen2.5:3b}
      - VISION_MODEL=${VISION_MODEL:-qwen2.5vl:3b}
      - VISION_PROVIDER=${VISION_PROVIDER:-gemini}
      - EXPLANATION_CACHE_TTL_SECONDS=${EXPLANATION_CACHE_TTL_SECONDS:-86400}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./backend/credentials:/run/secrets:ro

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-3016}:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8016}
      - WATCHPACK_POLLING=300
    volumes:
      - ./web:/app
      - /app/node_modules

  mobile:
    build: ./mobile
    ports:
      - "${MOBILE_PORT:-3017}:3017"
    depends_on:
      - backend
    # Serves the pre-built Flutter web release bundle via nginx (see
    # mobile/Dockerfile). The Flutter app runs in the browser and talks to the
    # host-exposed backend at http://localhost:8016 (ApiClient's web default),
    # so no source mount or API_URL runtime env is needed here.

volumes:
  pgdata:

